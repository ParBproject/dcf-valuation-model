# Base-case assumptions for MSFT. Unset drivers default to historical averages
# from the snapshot (see src/dcf/model/fcf.py::drivers).
forecast_years: 10          # explicit period; growth fades linearly to g
terminal_growth: 0.025      # long-run nominal growth, capped at 4% in terminal.py
exit_ev_ebitda: 12.0        # cross-check only; not used for the headline price
notes:
  - "D&A is tagged as Depreciation only (amortisation excluded), so historical FCF and the D&A ratio are slightly understated."
  - "Capex/revenue was about 35% in FY2026, up from about 12% in FY2021. The explicit forecast uses the 6-year average (about 19%). Terminal value uses reinvestment = g / ROIC, so that ratio is not carried forward."
