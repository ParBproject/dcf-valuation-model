name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Contact for SEC EDGAR requests (repo secret); code falls back to a documented default.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: make lint
      - run: make test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test   # axe, keyboard, mobile, visual baselines
      - run: npm run e2e
        env:
          SHOTS_DIR: ${{ runner.temp }}/dcf-shots
