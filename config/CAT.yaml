# Base-case assumptions for CAT. Unset drivers default to historical averages
# from the snapshot (see src/dcf/model/fcf.py::drivers).
forecast_years: 10          # M3.5: 10-year explicit period, growth fades linearly to g
terminal_growth: 0.025      # long-run nominal growth, capped at 4% in terminal.py
exit_ev_ebitda: 12.0        # cross-check only; not used for the headline price
captive_finance: true       # M3.5: net Cat Financial receivables against debt
notes:
  - "Interest is InterestPaidNet (cash paid, not expense); used as the cost-of-debt proxy."
  - "M3.5: Cat Financial finance receivables (current + noncurrent, NotesAndLoansReceivableNet*) are netted against total debt and current receivables are excluded from NWC. Approximation: assumes captive debt roughly equals the receivables it funds."
